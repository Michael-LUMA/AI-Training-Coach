<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>MARK · 你的运动陪伴智能体</title>
<style>
:root{
  --bg:#f6f7f9;--card:#ffffff;
  --line:rgba(15,23,42,.09);--text:#17202c;--dim:#5f6b7c;--dimmer:#94a0ae;
  --mint:#0fb77f;--blue:#3b6ef0;--violet:#7c5cf0;--amber:#e8912d;--red:#e05252;
  --grad:linear-gradient(135deg,#0fb77f,#3b6ef0);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonicOS Sans SC","Microsoft YaHei",sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
  background-image:
    radial-gradient(ellipse 80% 50% at 70% -10%,rgba(59,110,240,.06),transparent),
    radial-gradient(ellipse 60% 40% at 110% 110%,rgba(15,183,127,.06),transparent);
}
header{
  display:flex;align-items:center;gap:12px;padding:14px 18px;
  border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.75);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  z-index:10;
}
.orb{width:34px;height:34px;border-radius:50%;position:relative;flex:none;
  background:conic-gradient(from 120deg,#0fb77f,#3b6ef0,#7c5cf0,#0fb77f);
  animation:spin 6s linear infinite;}
.orb::after{content:'';position:absolute;inset:3px;border-radius:50%;background:#fff;}
.orb::before{content:'';position:absolute;inset:9px;border-radius:50%;background:var(--grad);z-index:1;
  animation:pulse 2.4s ease-in-out infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:.5;transform:scale(.82)}}
.brand{font-weight:700;letter-spacing:.14em;font-size:15px}
.brand small{display:block;font-weight:400;letter-spacing:.02em;color:var(--dim);font-size:11px;margin-top:1px}
#status{margin-left:auto;font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px}
#status .dot{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px rgba(15,183,127,.6)}
#status.thinking .dot{background:var(--amber);box-shadow:0 0 8px rgba(232,145,45,.6)}
#legacy{font-size:12px;color:var(--dimmer);text-decoration:none;border:1px solid var(--line);
  padding:5px 10px;border-radius:8px;transition:.2s;background:#fff}
#legacy:hover{color:var(--text);border-color:var(--dimmer)}
#livestrip{display:flex;border-bottom:1px solid var(--line);background:linear-gradient(90deg,rgba(15,183,127,.06),rgba(59,110,240,.06));}
#livestrip[hidden]{display:none}
.ls-cell{flex:1;text-align:center;padding:8px 4px;border-right:1px solid var(--line)}
.ls-cell:last-of-type{border-right:none}
.ls-v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.ls-v em{font-style:normal;font-size:10px;color:var(--dim);margin-left:2px}
.ls-l{font-size:10px;color:var(--dimmer);margin-top:1px;letter-spacing:.08em}
#ls-end{flex:none;padding:0 14px;border:none;background:none;color:var(--red);font-size:12px;cursor:pointer}
#stream{flex:1;overflow-y:auto;padding:18px 14px 8px;scroll-behavior:smooth}
#stream::-webkit-scrollbar{width:4px}
#stream::-webkit-scrollbar-thumb{background:rgba(15,23,42,.15);border-radius:2px}
.wrap{max-width:760px;margin:0 auto}
.msg{display:flex;gap:10px;margin-bottom:18px;animation:rise .25s ease}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.user{flex-direction:row-reverse}
.avatar{width:30px;height:30px;border-radius:50%;flex:none;margin-top:2px;
  background:conic-gradient(from 120deg,#0fb77f,#3b6ef0,#7c5cf0,#0fb77f);position:relative}
.avatar::after{content:'';position:absolute;inset:2.5px;border-radius:50%;background:#fff}
.avatar::before{content:'';position:absolute;inset:8px;border-radius:50%;background:var(--grad);z-index:1}
.bubble{max-width:82%;padding:11px 14px;border-radius:16px;font-size:14.5px;line-height:1.65;
  word-break:break-word;white-space:pre-wrap}
.msg.mark .bubble{background:#fff;border:1px solid var(--line);border-top-left-radius:4px;
  box-shadow:0 1px 3px rgba(15,23,42,.05)}
.msg.user .bubble{background:linear-gradient(135deg,#3b6ef0,#5b8cff);color:#fff;
  border-top-right-radius:4px;box-shadow:0 2px 8px rgba(59,110,240,.25)}
.msg .meta{display:flex;gap:8px;align-items:center;margin-top:5px;font-size:11px;color:var(--dimmer)}
.lane{border:1px solid var(--line);border-radius:20px;padding:1px 8px;background:#fff}
.tag-live{color:var(--mint);border-color:rgba(15,183,127,.4)}
.tag-urgent{color:var(--red);border-color:rgba(224,82,82,.4)}
.say{cursor:pointer;color:var(--dimmer);border:1px solid var(--line);border-radius:20px;background:#fff;font-size:11px;padding:1px 8px}
.say:hover{color:var(--mint);border-color:rgba(15,183,127,.4)}
.dots{display:inline-flex;gap:5px;padding:4px 2px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--mint);animation:bounce 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s;background:var(--blue)}
.dots i:nth-child(3){animation-delay:.24s;background:var(--violet)}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-6px);opacity:1}}
.think-label{font-size:12px;color:var(--dim);margin-top:4px;min-height:16px}
.card{max-width:82%;margin:-8px 0 18px 40px;background:#fff;border:1px solid var(--line);
  border-radius:14px;padding:14px 16px;animation:rise .25s ease;
  box-shadow:0 2px 10px rgba(15,23,42,.06)}
.card h4{font-size:12px;color:var(--dim);font-weight:500;letter-spacing:.06em;margin-bottom:10px;
  display:flex;align-items:center;gap:6px}
.card h4::before{content:'';width:6px;height:6px;border-radius:2px;background:var(--grad)}
.metric-row{display:flex;gap:18px;flex-wrap:wrap}
.metric .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--grad);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.metric .v em{font-style:normal;font-size:11px;-webkit-text-fill-color:var(--dim);font-weight:400;margin-left:2px}
.metric .l{font-size:11px;color:var(--dimmer);margin-top:2px}
.wtemp{font-size:26px;font-weight:700}
.wtemp span{font-size:14px;color:var(--dim)}
.wdesc{color:var(--dim);font-size:13px;margin-top:4px}
.step{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.step:last-child{border-bottom:none}
.step .n{flex:none;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--dim)}
.step .d{margin-left:auto;color:var(--dimmer);font-size:12px;flex:none}
.route-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.route-head .km{font-size:22px;font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.route-head .min{color:var(--dim);font-size:12px}
.card .go{margin-top:10px;width:100%;padding:9px;border:none;border-radius:10px;background:var(--grad);
  color:#fff;font-weight:600;font-size:13px;cursor:pointer}
#chips{padding:8px 14px 4px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
#chips .wrap{display:flex;gap:8px}
.chip{flex:none;border:1px solid var(--line);background:#fff;color:var(--dim);
  font-size:12.5px;padding:7px 14px;border-radius:20px;cursor:pointer;transition:.2s}
.chip:hover{color:var(--text);border-color:var(--dimmer)}
.chip.hot{color:#fff;background:var(--grad);border-color:transparent}
.chip.danger{color:var(--red);border-color:rgba(224,82,82,.4)}
footer{padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
  background:rgba(255,255,255,.85);backdrop-filter:blur(14px)}
footer .wrap{display:flex;gap:9px;align-items:flex-end}
#input{flex:1;resize:none;border:1px solid var(--line);background:#fff;color:var(--text);
  border-radius:18px;padding:11px 15px;font-size:14.5px;line-height:1.4;max-height:110px;
  font-family:inherit;outline:none;transition:border-color .2s}
#input:focus{border-color:rgba(59,110,240,.5)}
.roundbtn{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);
  background:#fff;color:var(--dim);cursor:pointer;display:flex;align-items:center;
  justify-content:center;transition:.2s}
.roundbtn:hover{color:var(--text)}
.roundbtn svg{width:18px;height:18px;fill:currentColor}
#send{background:var(--grad);border:none}
#send svg{fill:#fff}
#mic.listening{color:var(--red);border-color:var(--red);animation:pulse 1s infinite}
@media (min-width:761px){body{align-items:center}header,#livestrip,#stream,#chips,footer{width:100%;max-width:820px}
  #stream{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
</style>

</head>
<body>
<header>
  <div class="orb"></div>
  <div class="brand">MARK<small>你的运动陪伴智能体</small></div>
  <div id="status"><span class="dot" id="status-dot"></span><span id="status-text">在线</span></div>
  <a id="legacy" href="/ride">旧版工作台</a>
</header>
<div id="livestrip" hidden>
  <div class="ls-cell"><div class="ls-v"><span id="ls-speed">--</span><em>km/h</em></div><div class="ls-l">速度</div></div>
  <div class="ls-cell"><div class="ls-v"><span id="ls-hr">--</span><em>bpm</em></div><div class="ls-l">心率</div></div>
  <div class="ls-cell"><div class="ls-v"><span id="ls-dist">--</span><em>km</em></div><div class="ls-l">距离</div></div>
  <div class="ls-cell"><div class="ls-v"><span id="ls-time">--</span><em>min</em></div><div class="ls-l">时长</div></div>
  <button id="ls-end">结束</button>
</div>
<main id="stream"><div class="wrap" id="stream-inner"></div></main>
<div id="chips"><div class="wrap" id="chips-inner"></div></div>
<footer><div class="wrap">
  <button class="roundbtn" id="mic" title="按住说话">
    <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2z"/></svg>
  </button>
  <textarea id="input" rows="1" placeholder="和 Mark 说点什么…"></textarea>
  <button class="roundbtn" id="send" title="发送">
    <svg viewBox="0 0 24 24"><path d="M3 20v-6l9-2-9-2V4l19 8z"/></svg>
  </button>
</div></footer>
<script>
'use strict';
/* ================= 基础 ================= */
const $=id=>document.getElementById(id);
const stream=$('stream-inner');
const TZ=-new Date().getTimezoneOffset();
const CONV_ID='conv-'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);
let token=null, ttsAvailable=true, asrAvailable=false;
async function getToken(){
  if(token)return token;
  const r=await fetch('/api/coach/config',{cache:'no-store'});
  const d=await r.json();
  token=d.token;ttsAvailable=!!d.tts_available;asrAvailable=!!d.asr_available;
  return token;
}
function scrollDown(){const s=$('stream');s.scrollTop=s.scrollHeight;}
/* 统一用 DOM 构建，不拼接 HTML 串：模型文本与外部数据只走 textContent。 */
function node(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined&&text!==null)e.textContent=String(text);return e;}
/* ================= 语音播报 ================= */
let voiceSeq=0,currentAudio=null;
function speak(text){
  if(!text)return;
  const seq=++voiceSeq;
  if(currentAudio){try{currentAudio.pause();}catch(_){/* */}}
  if('speechSynthesis' in window){
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=1.08;u.pitch=1.0;
    window.speechSynthesis.speak(u);
    return;
  }
  if(!ttsAvailable||!token)return;
  (async()=>{
    try{
      const r=await Promise.race([
        fetch('/api/coach/ride/speak',{method:'POST',headers:{'Content-Type':'application/json','X-Coach-Token':token},body:JSON.stringify({text})}),
        new Promise((_,rej)=>setTimeout(()=>rej(new Error('t')),8000))]);
      const d=await r.json().catch(()=>null);
      if(seq!==voiceSeq)return;
      if(d&&d.tts_status==='not_configured')ttsAvailable=false;
      if(!r.ok||!d||d.tts_status!=='ok'||typeof d.audio_url!=='string')throw new Error('tts');
      const a=new Audio(d.audio_url);currentAudio=a;
      a.onended=a.onerror=()=>{if(currentAudio===a)currentAudio=null;};
      await a.play();
    }catch(_){/* 静默：语音是加分项，文字永远在 */}
  })();
}
/* ================= 消息渲染 ================= */
const LANE_NAME={personal:'翻了你的记录',knowledge:'查了运动知识库',general:'自由聊',live:'看了实时数据',planner:'检索了历史'};
let typeSeq=0;
function typewrite(bubble,text){
  const seq=++typeSeq;
  const step=Math.max(1,Math.ceil(text.length/50));
  let i=0;
  const tick=()=>{
    if(seq!==typeSeq){bubble.textContent=text;scrollDown();return;}
    i=Math.min(text.length,i+step);
    bubble.textContent=text.slice(0,i);
    scrollDown();
    if(i<text.length)setTimeout(tick,16);
  };
  tick();
}
function addMsg(role,text,opts){
  opts=opts||{};
  const div=node('div','msg '+role);
  if(role==='mark')div.appendChild(node('div','avatar'));
  const col=node('div');
  if(role==='mark'){
    const bubble=node('div','bubble');
    col.appendChild(bubble);
    typewrite(bubble,text);
  }else{
    col.appendChild(node('div','bubble',text));
  }
  if(role==='mark'){
    const meta=node('div','meta');
    if(opts.tag==='live')meta.appendChild(node('span','lane tag-live','运动中·主动播报'));
    if(opts.tag==='urgent')meta.appendChild(node('span','lane tag-urgent','安全提醒'));
    if(opts.lane&&LANE_NAME[opts.lane])meta.appendChild(node('span','lane',LANE_NAME[opts.lane]));
    const say=node('button','say','🔊 听');
    say.onclick=()=>speak(text);
    meta.appendChild(say);
    col.appendChild(meta);
  }
  div.appendChild(col);
  stream.appendChild(div);
  scrollDown();
  return div;
}
/* 思考态：旋转的能力标签，让「Mark 在想」可见 */
let thinkingEl=null,thinkingTimer=null;
const THINK_DEFAULT=['正在想…','正在组织语言…','马上就好…'];
function addThinking(labels){
  removeThinking();
  labels=labels&&labels.length?labels:THINK_DEFAULT;
  thinkingEl=node('div','msg mark');
  thinkingEl.appendChild(node('div','avatar'));
  const col=node('div');
  const bubble=node('div','bubble');
  const dots=node('span','dots');
  dots.appendChild(node('i'));dots.appendChild(node('i'));dots.appendChild(node('i'));
  bubble.appendChild(dots);col.appendChild(bubble);
  const labelEl=node('div','think-label',labels[0]);
  col.appendChild(labelEl);
  thinkingEl.appendChild(col);
  stream.appendChild(thinkingEl);
  let i=0;
  thinkingTimer=setInterval(()=>{i=(i+1)%labels.length;labelEl.textContent=labels[i];},1400);
  $('status').classList.add('thinking');$('status-text').textContent='思考中';
  scrollDown();
}
function removeThinking(){
  if(thinkingTimer){clearInterval(thinkingTimer);thinkingTimer=null;}
  if(thinkingEl){thinkingEl.remove();thinkingEl=null;}
  $('status').classList.remove('thinking');$('status-text').textContent='在线';
}
/* 卡片 */
function addCard(title){
  const card=node('div','card');
  card.appendChild(node('h4','',title));
  stream.appendChild(card);scrollDown();
  return card;
}
function metric(value,unit,label){
  const m=node('div','metric');
  const v=node('div','v');
  v.appendChild(node('span','',value));
  if(unit)v.appendChild(node('em','',unit));
  m.appendChild(v);
  m.appendChild(node('div','l',label));
  return m;
}
function weatherCard(w){
  const card=addCard('天气 · 高德');
  const temp=node('div','wtemp');
  temp.appendChild(node('span','',String(w.day_temp)+'°'));
  temp.appendChild(node('span','',' / 夜 '+String(w.night_temp)+'°'));
  card.appendChild(temp);
  card.appendChild(node('div','wdesc',String(w.city)+' · 白天'+String(w.day_weather)+' · 夜间'+String(w.night_weather)));
}
function statsCard(s){
  const card=addCard('你的骑行数据');
  const row=node('div','metric-row');
  row.appendChild(metric(String(s.total),'次','累计记录'));
  row.appendChild(metric(String(s.weekCount),'次','本周'));
  row.appendChild(metric(String(s.weekMin),'min','本周时长'));
  if(s.weekKm!==null)row.appendChild(metric(String(s.weekKm),'km','本周距离'));
  card.appendChild(row);
}
function routeCard(route,onGo){
  const card=addCard('路线 · '+route.destination);
  const head=node('div','route-head');
  head.appendChild(node('span','km',(route.distance_m/1000).toFixed(1)+' km'));
  head.appendChild(node('span','min','约 '+Math.max(1,Math.round(route.duration_s/60))+' 分钟 · '+route.steps.length+' 个转向'));
  card.appendChild(head);
  route.steps.slice(0,8).forEach((s,i)=>{
    const step=node('div','step');
    step.appendChild(node('span','n',String(i+1)));
    step.appendChild(node('span','',s.instruction));
    step.appendChild(node('span','d',Math.round(s.distance_m)+'m'));
    card.appendChild(step);
  });
  const go=node('button','go','开始导航');
  go.onclick=onGo;
  card.appendChild(go);
}
/* ================= 上下文数据 ================= */
let lastWeather=null;
async function ensureWeather(){
  if(lastWeather)return lastWeather;
  const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:4000,maximumAge:300000}));
  const c=pos&&pos.coords;if(!c)throw new Error('geo');
  const t=await getToken();
  const r=await fetch('/api/coach/ride/weather',{method:'POST',headers:{'Content-Type':'application/json','X-Coach-Token':t},body:JSON.stringify({lat:c.latitude,lng:c.longitude})});
  const d=await r.json().catch(()=>null);
  if(r.ok&&d&&d.weather_status==='ok'&&d.weather){lastWeather=d.weather;return lastWeather;}
  throw new Error('weather');
}
async function fetchSessions(){
  const t=await getToken();
  const r=await fetch('/api/coach/ride/sessions',{cache:'no-store',headers:{'X-Coach-Token':t}});
  const d=await r.json();
  return Array.isArray(d.sessions)?d.sessions:[];
}
function localStats(sessions){
  const real=sessions.filter(m=>m&&m.source!=='simulated'&&typeof m.started_at==='string');
  const now=new Date();const monday=new Date(now);monday.setHours(0,0,0,0);monday.setDate(monday.getDate()-(monday.getDay()+6)%7);
  const week=real.filter(m=>Date.parse(m.started_at)>=monday.getTime());
  let weekMin=0,weekKm=0,hasDist=true;
  for(const m of week){const s=m.summary||{};
    if(typeof s.duration_s==='number')weekMin+=s.duration_s/60;
    if(typeof s.distance_m==='number')weekKm+=s.distance_m/1000;else hasDist=false;}
  return {total:real.length,weekCount:week.length,weekMin:Math.round(weekMin),weekKm:hasDist&&week.length?weekKm.toFixed(1):null};
}
/* ================= 意图与思考标签 ================= */
const RE_WEATHER=/天气|下雨|温度|穿什么|适合.*(骑|出门|运动)/;
const RE_RECORD=/累计|这周|本周|这个月|本月|上次|最近|几次|多久|多远|状态|心率|历史|记录/;
const RE_ROUTE=/^(?:帮我)?(?:导航|规划路线|指路|骑车去|走路去|去)(.{1,30})$/;
const RE_LIVE=/现在|当前|这会|此刻|实时|刚刚/;
function thinkLabelsFor(q){
  if(RE_WEATHER.test(q))return['正在看天气…','正在组织语言…'];
  if(RE_ROUTE.test(q))return['正在规划路线…','正在查地图…'];
  if(RE_LIVE.test(q)&&riding)return ['正在看实时数据…','正在想…'];
  if(RE_RECORD.test(q))return ['正在翻你的记录…','正在核对数字…'];
  return THINK_DEFAULT;
}
/* ================= 导航状态 ================= */
let navRoute=null;
function navFacts(){
  if(!navRoute)return null;
  const step=navRoute.steps[navRoute.index];
  const facts={destination:navRoute.destination,remaining_km:Math.round(navRoute.remaining_m/100)/10,
    step_index:navRoute.index+1,step_count:navRoute.steps.length,off_route:false};
  if(step){facts.next_instruction=step.instruction;facts.next_distance_m=Math.round(step.distance_m);}
  return facts;
}
/* ================= 发送主流程 ================= */
let sending=false;
async function send(){
  const q=$('input').value.trim();
  if(!q||sending)return;
  typeSeq++;
  sending=true;$('input').value='';autogrow();
  addMsg('user',q);
  const routeMatch=q.match(RE_ROUTE);
  if(routeMatch&&!riding){
    addThinking(['正在规划路线…','正在查地图…']);
    try{await planRoute(routeMatch[1].trim());}catch(e){removeThinking();addMsg('mark','路线规划失败了：'+(e&&e.message==='geo'?'定位没拿到，检查一下定位权限。':'地图服务暂时不可用，稍后再试。'));}
    sending=false;refreshChips();return;
  }
  addThinking(thinkLabelsFor(q));
  try{
    if(RE_WEATHER.test(q)&&!lastWeather){try{await ensureWeather();}catch(_){/* 没天气照样聊 */}}
    const body={question:q,conv_id:CONV_ID,tz_offset_min:TZ};
    if(riding&&liveId)body.live_id=liveId;
    if(lastWeather)body.weather=lastWeather;
    const nf=navFacts();if(nf)body.nav=nf;
    const t=await getToken();
    const r=await fetch('/api/coach/ride/chat',{method:'POST',headers:{'Content-Type':'application/json','X-Coach-Token':t},body:JSON.stringify(body)});
    const d=await r.json().catch(()=>null);
    removeThinking();
    if(r.ok&&d&&d.speech_status==='ok'&&typeof d.speech==='string'&&d.speech.trim()){
      addMsg('mark',d.speech,{lane:d.lane});
      if(RE_WEATHER.test(q)&&lastWeather)weatherCard(lastWeather);
      if(RE_RECORD.test(q)){try{statsCard(localStats(await fetchSessions()));}catch(_){/* 卡片是加分项 */}}
    }else{
      addMsg('mark','这个我暂时答不上来，换个问法试试。');
    }
  }catch(_){
    removeThinking();
    addMsg('mark','网络好像断了，我先缓缓，你再说一次？');
  }
  sending=false;refreshChips();
}
/* ================= 路线规划 ================= */
async function planRoute(dest){
  const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:15000,maximumAge:60000})).catch(()=>{throw new Error('geo');});
  const c=pos.coords;
  const t=await getToken();
  const r=await fetch('/api/coach/ride/route',{method:'POST',headers:{'Content-Type':'application/json','X-Coach-Token':t},
    body:JSON.stringify({origin:c.longitude.toFixed(6)+','+c.latitude.toFixed(6),destination_address:dest,mode:'bicycling'})});
  const d=await r.json().catch(()=>null);
  removeThinking();
  if(!r.ok||!d||d.route_status!=='ok'||!Array.isArray(d.steps)||!d.steps.length){
    addMsg('mark','这条路线我没规划出来，换个说法或者确认下目的地名字。');return;
  }
  const steps=d.steps.map(s=>({instruction:String(s.instruction||''),distance_m:Number(s.distance_m)||0})).filter(s=>s.instruction);
  navRoute={destination:dest,distance_m:d.distance_m,duration_s:d.duration_s,steps,index:0,remaining_m:d.distance_m};
  addMsg('mark','到'+dest+'，全程'+(d.distance_m/1000).toFixed(1)+'公里，约'+Math.max(1,Math.round(d.duration_s/60))+'分钟。路线放下面了，点开始导航我就一路提醒你。');
  routeCard({destination:dest,distance_m:d.distance_m,duration_s:d.duration_s,steps},()=>{
    addMsg('mark','导航开始，转弯我会提前说。',{tag:'live'});speak('导航开始');
    if(!riding)startRide();
  });
}
/* ================= 骑行模式 ================= */
let riding=false,liveId=null,liveTimer=null,watchId=null,lastFix=null,rideStart=0,rideDist=0,prevFix=null;
function startRide(){
  if(riding)return;
  riding=true;rideStart=Date.now();rideDist=0;prevFix=null;liveId=null;
  $('livestrip').hidden=false;
  watchId=navigator.geolocation.watchPosition(p=>{lastFix=p;
    if(prevFix){rideDist+=hav(prevFix.coords.latitude,prevFix.coords.longitude,p.coords.latitude,p.coords.longitude);}
    prevFix=p;renderStrip();
  },()=>{},{enableHighAccuracy:true,maximumAge:3000});
  liveTimer=setInterval(liveBeat,10000);
  refreshChips();
  /* 出发简报：结合真实天气，本地确定性生成，立即开口 */
  (async()=>{
    let w=null;
    try{w=await ensureWeather();}catch(_){/* 没天气也照常出发 */}
    let briefing='出发了，我一路盯着：速度、里程、路况，有事随时喊我。';
    if(w){
      const temp=(w.day_temp!==undefined&&w.day_temp!==null)?('，气温'+w.day_temp+'度'):'';
      briefing='出发了。'+String(w.city||'')+'今天白天'+String(w.day_weather||'')+temp+'。';
      const bad=/雨|雪|雷|冰|霾/.test(String(w.day_weather||''));
      if(bad)briefing+='天不算好，路滑慢点，视线差就别抢。';
      else briefing+='天不错，放心骑。';
      briefing+='速度、里程、路况我都盯着，有事随时喊我。';
    }
    addMsg('mark',briefing,{tag:'live'});
    speak(briefing);
  })();
}
function endRide(){
  riding=false;
  if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null;}
  if(liveTimer){clearInterval(liveTimer);liveTimer=null;}
  $('livestrip').hidden=true;liveId=null;
  const min=Math.round((Date.now()-rideStart)/60000);
  addMsg('mark','这次骑了'+min+'分钟、'+(rideDist/1000).toFixed(1)+'公里。想聊细节随时问。');
  refreshChips();
}
function renderStrip(){
  if(!lastFix)return;
  const c=lastFix.coords;
  $('ls-speed').textContent=(typeof c.speed==='number'&&c.speed>=0)?(c.speed*3.6).toFixed(1):'--';
  $('ls-dist').textContent=(rideDist/1000).toFixed(1);
  $('ls-time').textContent=String(Math.round((Date.now()-rideStart)/60000));
}
setInterval(()=>{if(riding)renderStrip();},5000);
async function liveBeat(){
  if(!riding||!lastFix)return;
  try{
    if(!liveId)liveId='live-'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);
    const c=lastFix.coords;
    const point={t:Date.now()/1000,lat:c.latitude,lng:c.longitude,speed_mps:typeof c.speed==='number'&&c.speed>=0?c.speed:0};
    if(typeof c.altitude==='number'&&Number.isFinite(c.altitude))point.alt=c.altitude;
    const t=await getToken();
    const r=await fetch('/api/coach/ride/live',{method:'POST',headers:{'Content-Type':'application/json','X-Coach-Token':t},body:JSON.stringify({live_id:liveId,activity:'ride',point})});
    const d=await r.json().catch(()=>null);
    if(!r.ok||!d||!Array.isArray(d.calls))return;
    for(const call of d.calls){
      if(call&&typeof call.speech==='string'&&call.speech.trim()){
        const urgent=call.urgent===true;
        addMsg('mark',call.speech,{tag:urgent?'urgent':'live'});
        speak(call.speech);
      }
    }
  }catch(_){/* 网络抖动，下一拍再来 */}
}
function hav(a,b,c2,d){const R=6371000,r=Math.PI/180;
  const h=Math.sin((c2-a)*r/2)**2+Math.cos(a*r)*Math.cos(c2*r)*Math.sin((d-b)*r/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));}
/* ================= 语音输入 ================= */
const SpeechEngine=window.SpeechRecognition||window.webkitSpeechRecognition;
function resampleTo16k(chunks,rate){
  let len=0;for(const c of chunks)len+=c.length;
  const src=new Float32Array(len);let o=0;
  for(const c of chunks){src.set(c,o);o+=c.length;}
  if(rate===16000)return src;
  const ratio=rate/16000,outLen=Math.floor(len/ratio),out=new Float32Array(outLen);
  for(let i=0;i<outLen;i++){const p=i*ratio,i0=Math.floor(p),f=p-i0;
    out[i]=i0+1<len?src[i0]*(1-f)+src[i0+1]*f:src[i0];}
  return out;
}
function wavFromPcm(pcm,rate){
  const n=pcm.length;
  const buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
  const w=(at,s)=>{for(let i=0;i<s.length;i++)v.setUint8(at+i,s.charCodeAt(i));};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');
  v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);
  w(36,'data');v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){const s=Math.max(-1,Math.min(1,pcm[i]));v.setInt16(44+i*2,s<0?s*0x8000:s*0x7FFF,true);}
  return new Blob([buf],{type:'audio/wav'});
}
let micSession=null;
function micStop(){
  const btn=$('mic');
  if(!micSession)return;
  const s=micSession;micSession=null;
  window.removeEventListener('pointerup',micStop);
  window.removeEventListener('pointercancel',micStop);
  btn.classList.remove('listening');
  $('status-text').textContent='识别中…';
  Promise.resolve(s.stop()).finally(()=>{$('status-text').textContent='在线';});
}
async function micStart(){
  const btn=$('mic');
  if(micSession)return;
  if(asrAvailable&&navigator.mediaDevices&&(window.AudioContext||window.webkitAudioContext)){
    let stream2=null,released=false;
    const earlyRelease=()=>{released=true;};
    window.addEventListener('pointerup',earlyRelease,{once:true});
    try{
      stream2=await navigator.mediaDevices.getUserMedia({audio:true});
    }catch(e){
      window.removeEventListener('pointerup',earlyRelease);
      const name=e&&e.name||'';
      if(name==='NotAllowedError'||name==='SecurityError')
        addMsg('mark','麦克风权限被拒了。点地址栏左边的小锁，把麦克风改成允许，再刷新页面。');
      else if(name==='NotFoundError')
        addMsg('mark','没找到麦克风设备，检查一下耳机或麦克风插好了吗。');
      else
        addMsg('mark','麦克风打不开（'+(name||'未知原因')+'），先打字吧。');
      return;
    }
    if(released){stream2.getTracks().forEach(t=>t.stop());return;}
    window.removeEventListener('pointerup',earlyRelease);
    try{
      const ctx=new (window.AudioContext||window.webkitAudioContext)();
      const src=ctx.createMediaStreamSource(stream2);
      const proc=ctx.createScriptProcessor(4096,1,1);
      const chunks=[];
      proc.onaudioprocess=e=>chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
      src.connect(proc);proc.connect(ctx.destination);
      btn.classList.add('listening');
      const t0=Date.now();
      $('status-text').textContent='正在听… 0s';
      const tick=setInterval(()=>{$('status-text').textContent='正在听… '+((Date.now()-t0)/1000).toFixed(0)+'s';},500);
      window.addEventListener('pointerup',micStop);
      window.addEventListener('pointercancel',micStop);
      const rate=ctx.sampleRate;
      /* 流式识别：每 1.6s 把新录到的音频段发上去，松手时基本只剩尾巴 */
      const asrId='asr-'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);
      let sentSamples=0,segChain=Promise.resolve(),segBroken=false;
      const flushSegment=(final)=>{
        let len=0;for(const c of chunks)len+=c.length;
        if(len-sentSamples<(final?1600:8000))return Promise.resolve();
        const all=new Float32Array(len);let off=0;
        for(const c of chunks){all.set(c,off);off+=c.length;}
        const delta=all.subarray(sentSamples);sentSamples=len;
        const pcm=resampleTo16k([delta],rate);
        if(!pcm.length)return Promise.resolve();
        return getToken().then(t=>fetch('/api/coach/ride/asr/segment',{method:'POST',
          headers:{'Content-Type':'audio/wav','X-Coach-Token':t,'X-ASR-Id':asrId},
          body:wavFromPcm(pcm,16000)})).then(r=>{if(!r.ok)segBroken=true;}).catch(()=>{segBroken=true;});
      };
      const segTimer=setInterval(()=>{if(!segBroken)segChain=segChain.then(()=>flushSegment(false));},1600);
      micSession={stop:async()=>{
        clearInterval(segTimer);
        try{proc.disconnect();src.disconnect();await ctx.close();}catch(_){/* */}
        stream2.getTracks().forEach(t=>t.stop());
        const secs=chunks.length*4096/rate;
        if(secs<0.4){$('status-text').textContent='太短了，按住说完再松手';return;}
        try{
          const t=await getToken();
          let text='';
          if(!segBroken){
            await segChain;            /* 等已发出的段落落地 */
            await flushSegment(true);  /* 补上尾巴 */
            if(!segBroken){
              const r=await fetch('/api/coach/ride/asr/finish',{method:'POST',
                headers:{'Content-Type':'application/json','X-Coach-Token':t},
                body:JSON.stringify({asr_id:asrId})});
              const d=await r.json().catch(()=>null);
              if(r.ok&&d&&d.asr_status==='ok'&&typeof d.text==='string')text=d.text.trim();
              else if(!d||d.asr_status!=='no_speech')segBroken=true;
            }
          }
          if(segBroken){
            /* 流式管道坏了就整段重传，保证任何情况下都能识别 */
            const pcm=resampleTo16k(chunks,rate);
            const r=await fetch('/api/coach/ride/asr',{method:'POST',headers:{'Content-Type':'audio/wav','X-Coach-Token':t},body:wavFromPcm(pcm,16000)});
            const d=await r.json().catch(()=>null);
            if(d&&d.asr_status==='ok'&&typeof d.text==='string')text=d.text.trim();
          }
          if(text){$('input').value=text;autogrow();send();}
          else addMsg('mark','我没听清，靠近一点再说一次？');
        }catch(_){addMsg('mark','识别服务暂时不可用，打字告诉我吧。');}
      }};
      return;
    }catch(_){
      stream2.getTracks().forEach(t=>t.stop());
      addMsg('mark','音频初始化失败，换个浏览器（推荐 Chrome）或打字吧。');
      return;
    }
  }
  if(!SpeechEngine){addMsg('mark','这个浏览器不支持语音输入，打字吧。');return;}
  const rec=new SpeechEngine();rec.lang='zh-CN';rec.interimResults=false;
  btn.classList.add('listening');
  $('status-text').textContent='正在听…';
  micSession={stop:()=>{try{rec.stop();}catch(_){/* */}}};
  rec.onresult=e=>{const text=e.results[0]&&e.results[0][0]&&e.results[0][0].transcript;
    if(text){$('input').value=text.trim();autogrow();send();}};
  rec.onend=()=>{btn.classList.remove('listening');micSession=null;};
  rec.onerror=rec.onend;
  try{rec.start();}catch(_){btn.classList.remove('listening');micSession=null;}
}
/* ================= 建议 chips ================= */
function refreshChips(){
  const box=$('chips-inner');box.textContent='';
  const chips=riding?[
    ['现在速度多少','现在速度多少？'],['心率怎么样','现在心率多少？'],['还有多远','还有多远？'],
    ['路况提醒','前面路况怎么样？']]:
    lastWeather?[
    ['今天天气','今天天气怎么样？'],['适合运动吗','今天适合出去骑车吗？'],['我这周练了多少','我这周骑了多少？'],
    ['随便聊聊','给我讲个有意思的运动冷知识']]:[
    ['今天天气','今天天气怎么样？'],['我这周练了多少','我这周骑了多少？'],['规划路线','导航去'],
    ['随便聊聊','给我讲个有意思的运动冷知识']];
  for(const pair of chips){
    const b=node('button','chip',pair[0]);
    b.onclick=()=>{if(pair[1]==='导航去'){$('input').value='导航去';$('input').focus();}else{$('input').value=pair[1];send();}};
    box.appendChild(b);
  }
  const rideBtn=node('button','chip '+(riding?'danger':'hot'),riding?'■ 结束骑行':'▶ 开始骑行');
  rideBtn.onclick=()=>riding?endRide():startRide();
  box.appendChild(rideBtn);
}
/* ================= 启动 ================= */
function autogrow(){const el2=$('input');el2.style.height='auto';el2.style.height=Math.min(el2.scrollHeight,110)+'px';}
$('input').addEventListener('input',autogrow);
$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
$('send').onclick=send;
const micBtn=$('mic');
micBtn.addEventListener('pointerdown',e=>{e.preventDefault();micStart();});
$('ls-end').onclick=endRide;
(async()=>{
  try{await getToken();}catch(_){/* 配置拿不到也能打字试试 */}
  refreshChips();
  const hour=new Date().getHours();
  const greet=hour<6?'还没睡？我随时在。':hour<11?'早上好。':hour<14?'中午好。':hour<19?'下午好。':'晚上好。';
  addMsg('mark',greet+'我是 Mark，你的运动陪伴。可以问我天气、让我规划路线、翻你的骑行记录，或者就随便聊聊。点开始骑行，我会一路主动播报。',{lane:'general'});
  /* 日常主动开口：定位已授权且天气合适时，主动给出运动建议 */
  try{
    if(navigator.permissions&&navigator.permissions.query){
      const perm=await navigator.permissions.query({name:'geolocation'});
      if(perm.state==='granted'){
        const w=await ensureWeather();
        refreshChips();
        if(w&&hour>=6&&hour<20){
          const bad=/雨|雪|雷|冰|霾/.test(String(w.day_weather||''));
          const temp=typeof w.day_temp==='number'?w.day_temp:parseFloat(w.day_temp);
          if(!bad&&Number.isFinite(temp)&&temp>=8&&temp<=32){
            addMsg('mark','看了眼天：'+String(w.city)+'现在'+String(w.day_weather)+'、'+w.day_temp+'度，挺适合出去动一动的。想骑车的话说一声，我陪你。');
          }
        }
      }
    }
  }catch(_){/* 主动开口是加分项，失败就安静 */}
})();
